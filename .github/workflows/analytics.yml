
name: AIKidVerse1 Channel Analytics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Generate channel analytics report
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python analytics_report.py

      - name: Save report artifact
        uses: actions/upload-artifact@v4
        with:
          name: aikidverse1-analytics-report
          path: analytics_report.json
          retention-days: 7
